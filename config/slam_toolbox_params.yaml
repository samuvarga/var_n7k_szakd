slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    transform_publish_period: 0.02
    transform_timeout: 0.2
    throttle_scans: 1
    map_update_interval: 5.0
    resolution: 0.05
    max_laser_range: 10.0
    minimum_time_interval: 0.0
    use_scan_matching: true